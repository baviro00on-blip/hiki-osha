<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひきざん・おしゃれずかん - おしゃれカードを集めよう！</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap');

        body {
            font-family: 'Hachi Maru Pop', 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(135deg, #fff0f6 0%, #ffd6e7 50%, #ffadd2 100%);
            color: #9d174d;
            user-select: none;
            height: 100vh;
            overflow: hidden;
        }

        /* 3Dボタン風アニメーション */
        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 5px 0 rgba(0,0,0,0.3);
        }
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.3);
        }

        /* カードのホログラム・キラ演出（カード枠内に限定） */
        .card-foil {
            position: relative;
            overflow: hidden;
        }
        .card-foil::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(
                115deg,
                transparent 25%,
                rgba(255, 255, 255, 0.6) 45%,
                rgba(255, 0, 128, 0.4) 50%,
                rgba(0, 255, 255, 0.4) 55%,
                transparent 75%
            );
            transform: rotate(25deg);
            pointer-events: none;
            opacity: 0.7;
            animation: foilShift 4s infinite linear;
        }

        @keyframes foilShift {
            0% { transform: translateY(-30%) rotate(25deg); }
            100% { transform: translateY(30%) rotate(25deg); }
        }

        .gold-glow {
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.9), 0 0 5px rgba(255, 255, 255, 0.8), inset 0 0 12px rgba(251, 191, 36, 0.6);
        }

        .super-glow {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.9), 0 0 10px rgba(56, 189, 248, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.8);
        }

        /* 震えるアニメーション（間違い時） */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* 脈動アニメーション */
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 2s infinite ease-in-out;
        }

        /* 風で揺れる草むらのアニメーション */
        @keyframes grassSway {
            0%, 100% { transform: skewX(0deg); }
            50% { transform: skewX(-4deg); }
        }
        .animate-grass-sway {
            transform-origin: bottom center;
            animation: grassSway 2.5s ease-in-out infinite;
        }

        /* ハート弾丸飛翔アニメーション */
        @keyframes flyMissile {
            0% { transform: translate(0, 0) scale(0.6) rotate(-10deg); opacity: 0; }
            20% { opacity: 1; }
            80% { transform: translate(180px, -10px) scale(1.15) rotate(10deg); opacity: 1; }
            100% { transform: translate(210px, 0px) scale(1.3) rotate(0deg); opacity: 0; }
        }
        .animate-fly-missile {
            animation: flyMissile 0.45s ease-in forwards;
        }

        /* キャラクターの小刻みなバトルアニメーション */
        @keyframes pixelBounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }
        .animate-pixel-bounce {
            animation: pixelBounce 0.4s steps(2) infinite;
        }

        @keyframes pixelMonster {
            0%, 100% { transform: translateY(0px) scaleX(1); }
            50% { transform: translateY(-3px) scaleX(1.02); }
        }
        .animate-pixel-monster {
            animation: pixelMonster 0.5s steps(2) infinite;
        }

        /* ドット絵のくっきり描画指定 */
        .pixelated {
            image-rendering: pixelated;
        }

        /* 超豪華レインボーネオンボーダー（全クリア時） */
        @keyframes rainbowGlow {
            0% { box-shadow: 0 0 25px #ef4444, inset 0 0 15px #ef4444; }
            20% { box-shadow: 0 0 25px #f59e0b, inset 0 0 15px #f59e0b; }
            40% { box-shadow: 0 0 25px #10b981, inset 0 0 15px #10b981; }
            60% { box-shadow: 0 0 25px #06b6d4, inset 0 0 15px #06b6d4; }
            80% { box-shadow: 0 0 25px #8b5cf6, inset 0 0 15px #8b5cf6; }
            100% { box-shadow: 0 0 25px #ec4899, inset 0 0 15px #ec4899; }
        }
        .animate-rainbow-glow {
            animation: rainbowGlow 2s linear infinite;
        }
    </style>
</head>
<body class="flex flex-col h-screen text-pink-900 overflow-hidden relative">

    <!-- お祝い用花火・紙吹雪 Canvas -->
    <canvas id="celebration-canvas" class="pointer-events-none fixed inset-0 z-50 hidden"></canvas>

    <!-- ヘッダーナビゲーション -->
    <header class="bg-slate-900/90 border-b border-indigo-500/30 px-4 py-2.5 shadow-md shrink-0">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="showStageSelect()">
                <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-red-500 to-yellow-400 flex items-center justify-center font-black text-lg shadow-md border-2 border-white text-pink-900">
                    －
                </div>
                <h1 class="font-black text-lg sm:text-xl tracking-wider text-pink-300 drop-shadow">ひきざん・おしゃれずかん</h1>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="showAlbum()" class="bg-indigo-600 hover:bg-indigo-500 text-pink-100 font-bold py-1.5 px-3.5 rounded-full border border-indigo-300/40 flex items-center gap-1.5 shadow-md btn-3d text-xs sm:text-sm">
                    <i data-lucide="book-open" class="w-4 h-4 text-pink-200"></i>
                    <span>カードずかん (<span id="card-count">0/20</span>)</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-3 flex flex-col justify-between overflow-hidden">

        <!-- 1. レベル選択画面 -->
        <section id="stage-select-screen" class="flex flex-col justify-between h-full py-2 space-y-3">
            <div class="text-center space-y-1">
                <h2 class="text-xl sm:text-2xl font-extrabold text-pink-600 drop-shadow-sm">「レベル」をえらぼう！</h2>
                <p class="text-pink-500 font-bold text-xs sm:text-sm">クリアするとおしゃれカードをGETできるよ！</p>
            </div>

            <!-- 通知用トーストメッセージ -->
            <div id="toast-message" class="hidden transition-all duration-300 transform -translate-y-2 opacity-0 bg-slate-900/95 border-2 border-amber-400 text-pink-200 text-xs sm:text-sm font-black px-4 py-2 rounded-full shadow-2xl text-center max-w-sm mx-auto">
                メッセージ
            </div>

            <div id="stages-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-w-xl mx-auto w-full my-auto">
                <!-- JavaScriptでレベルボタンが動的に挿入されます -->
            </div>

            <div id="stage-footer-tip" class="text-center text-pink-600 font-bold text-[11px]">
                💡 クリアすると次のレベルがオープン！高いレベルほどたくさんのカードがもらえるよ！
            </div>
        </section>

        <!-- 2. ゲーム画面 -->
        <section id="game-screen" class="hidden flex flex-col justify-between h-full max-w-md mx-auto w-full py-1">
            <!-- 進行度・ヘッダー情報 -->
            <div class="w-full bg-slate-900/80 p-2.5 rounded-2xl border border-indigo-500/30 flex justify-between items-center shadow-lg shrink-0">
                <div class="flex items-center gap-2">
                    <span id="current-stage-title" class="text-lg sm:text-xl font-black text-pink-300">レベル1</span>
                    <span id="current-round-tag" class="text-[11px] bg-indigo-500/40 text-pink-200 px-2 py-0.5 rounded-full border border-indigo-400/30">5いかの ひきざん</span>
                </div>
                <!-- ライフ表示 -->
                <div class="flex items-center space-x-1" id="hearts-container">
                    <i data-lucide="heart" class="w-6 h-6 text-red-500 fill-red-500"></i>
                    <i data-lucide="heart" class="w-6 h-6 text-red-500 fill-red-500"></i>
                    <i data-lucide="heart" class="w-6 h-6 text-red-500 fill-red-500"></i>
                </div>
            </div>

            <!-- 残り問題数 10連四角ゲージ表示エリア -->
            <div id="master-gauge-container" class="w-full bg-slate-900/80 p-2 rounded-xl border border-purple-500/30 flex items-center justify-between gap-2 shadow-md shrink-0 my-1">
                <span class="text-[10px] font-black text-pink-300 shrink-0">のこり</span>
                <div id="master-gauge-boxes" class="flex flex-1 items-center justify-between gap-1">
                    <!-- JSで10個の四角ゲージを動的生成 -->
                </div>
            </div>

            <!-- バトルエリア（青空と風に揺れる草むら背景） -->
            <div class="w-full border-2 border-emerald-400/60 rounded-2xl p-2 flex items-center justify-between shrink-0 my-1 relative overflow-hidden h-36 shadow-2xl bg-gradient-to-b from-sky-400 via-sky-200 to-emerald-300">
                
                <!-- 雲アニメーション（背景遠景） -->
                <div class="absolute top-2 left-6 w-12 h-4 bg-white/70 rounded-full blur-[0.5px]"></div>
                <div class="absolute top-4 right-12 w-16 h-5 bg-white/60 rounded-full blur-[0.5px]"></div>

                <!-- 風で揺れる草むらレイヤー（下部） -->
                <div class="absolute bottom-0 inset-x-0 h-10 bg-emerald-500 border-t-2 border-emerald-400 flex items-end justify-around animate-grass-sway overflow-hidden pointer-events-none">
                    <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-b-[18px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-b-[24px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-b-[20px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-b-[26px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[9px] border-l-transparent border-r-[9px] border-r-transparent border-b-[19px] border-b-emerald-600"></div>
                </div>

                <!-- 左：おしゃれ女の子 -->
                <div class="relative z-20 flex items-center justify-center pl-2">
                    <div class="w-16 h-16 animate-pixel-bounce flex items-center justify-center filter drop-shadow-md select-none">
                        <!-- おしゃれな女の子SVG -->
                        <svg class="w-16 h-16 filter drop-shadow-lg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- 後ろ髪（ツインテール・茶色） -->
                            <path d="M8 10 C4 12 3 19 6 22 C8 20 9 16 10 13 Z" fill="#92400e" stroke="#451a03" stroke-width="0.8"/>
                            <path d="M21 10 C25 12 26 19 23 22 C21 20 20 16 19 13 Z" fill="#92400e" stroke="#451a03" stroke-width="0.8"/>
                            <!-- ピンクのリボン飾り -->
                            <polygon points="8,8 5,6 6,11" fill="#ec4899" stroke="#831843" stroke-width="0.6"/>
                            <polygon points="21,8 24,6 23,11" fill="#ec4899" stroke="#831843" stroke-width="0.6"/>
                            <!-- ワンピース（ピンク＆フリル） -->
                            <path d="M10 15 L19 15 L22 25 L7 25 Z" fill="#f472b6" stroke="#9d174d" stroke-width="0.8"/>
                            <path d="M7 25 Q10 27 12 25 Q14.5 27 17 25 Q19.5 27 22 25" fill="#fbcfe8" stroke="#9d174d" stroke-width="0.6"/>
                            <!-- 胸元のハートブローチ -->
                            <path d="M14.5 18.5 C14.5 17.5 13 17.5 13 18.5 C13 19.5 14.5 20.5 14.5 20.5 C14.5 20.5 16 19.5 16 18.5 C16 17.5 14.5 17.5 14.5 18.5 Z" fill="#fde047"/>
                            <!-- 脚＆かわいい靴 -->
                            <rect x="11" y="25" width="2.5" height="4.5" fill="#fed7aa"/>
                            <rect x="16" y="25" width="2.5" height="4.5" fill="#fed7aa"/>
                            <rect x="10.5" y="29" width="4" height="2.2" rx="1" fill="#ec4899" stroke="#831843" stroke-width="0.5"/>
                            <rect x="15.5" y="29" width="4" height="2.2" rx="1" fill="#ec4899" stroke="#831843" stroke-width="0.5"/>
                            <!-- 右に伸ばす腕＆ハートステッキ -->
                            <path d="M18 16 L24 14 L23 17 L18 18 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="0.6"/>
                            <line x1="23" y1="18" x2="28" y2="11" stroke="#fde047" stroke-width="1.4" stroke-linecap="round"/>
                            <path d="M28 10 C28 8.8 26.5 8.8 26.5 10 C26.5 11.2 28 12.2 28 12.2 C28 12.2 29.5 11.2 29.5 10 C29.5 8.8 28 8.8 28 10 Z" fill="#f43f5e" stroke="#fff" stroke-width="0.4"/>
                            <!-- 顔 -->
                            <circle cx="14.5" cy="10.5" r="5.2" fill="#ffedd5" stroke="#9a3412" stroke-width="0.7"/>
                            <!-- 前髪 -->
                            <path d="M9.3 10 C9.3 5.5 19.7 5.5 19.7 10 C18 8.5 16 9.5 14.5 8.2 C13 9.5 11 8.5 9.3 10 Z" fill="#92400e" stroke="#451a03" stroke-width="0.7"/>
                            <!-- キラキラおめめ＆ほっぺ -->
                            <circle cx="13.2" cy="11" r="0.9" fill="#1e1b4b"/>
                            <circle cx="17.2" cy="11" r="0.9" fill="#1e1b4b"/>
                            <circle cx="13.4" cy="10.7" r="0.3" fill="#ffffff"/>
                            <circle cx="17.4" cy="10.7" r="0.3" fill="#ffffff"/>
                            <ellipse cx="12" cy="12.5" rx="1" ry="0.6" fill="#fda4af" opacity="0.8"/>
                            <ellipse cx="18.2" cy="12.5" rx="1" ry="0.6" fill="#fda4af" opacity="0.8"/>
                            <!-- にっこり口 -->
                            <path d="M14.3 13 Q15.3 14 16.3 13" stroke="#e11d48" stroke-width="0.8" fill="none" stroke-linecap="round"/>
                        </svg>
                    </div>

                    <!-- 飛んでいくハート弾丸 -->
                    <div id="missile-anim" class="hidden absolute left-12 top-4 z-30 pointer-events-none">
                        <svg class="w-9 h-9 drop-shadow-lg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#f43f5e" stroke="#ffffff" stroke-width="1.8"/>
                            <path d="M7.5 6.5 C6.2 6.5 5.5 7.5 5.5 8.5" stroke="#fecdd3" stroke-width="1.5" stroke-linecap="round"/>
                            <circle cx="19" cy="4" r="1.2" fill="#fde047"/>
                            <circle cx="4" cy="15" r="1" fill="#fde047"/>
                        </svg>
                    </div>
                </div>

                <!-- 右：おしゃれグッズ（1問ごとに種類と色がランダムに変わりながら小さくなる） -->
                <div id="wild-pokemon-container" class="relative z-10 flex flex-col items-center justify-center w-36 h-32 pr-2 overflow-visible">
                    <div id="target-pokemon-scale-box" class="transition-all duration-500 origin-center flex flex-col items-center scale-[2.2]">
                        <div class="animate-pixel-monster flex flex-col items-center">
                            <div id="pixel-monster-svg-box" class="w-16 h-16 filter drop-shadow-xl flex items-center justify-center">
                                <!-- JSで生成されるランダムなおしゃれグッズSVG -->
                            </div>
                        </div>
                    </div>

                    <div id="hit-explosion" class="hidden absolute z-30 pointer-events-none">
                        <div class="text-3xl animate-ping">💖</div>
                    </div>

                    <div id="capture-stars" class="hidden absolute z-40 pointer-events-none text-2xl font-black text-pink-300 animate-bounce drop-shadow">
                        ✨ GET! ✨
                    </div>
                </div>
            </div>

            <!-- 問題表示 -->
            <div class="w-full shrink-0 my-2">
                <div class="w-full h-32 sm:h-36 rounded-2xl bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500 border-4 border-white shadow-xl flex flex-col items-center justify-center p-2 text-rose-700 animate-pulse-subtle">
                    <div id="question-text" class="text-4xl sm:text-5xl font-black tracking-wider text-rose-700 my-1">
                        2 － 1
                    </div>
                    <div id="yomi-text" class="text-xs sm:text-sm font-bold text-pink-600 bg-amber-100/90 px-3 py-0.5 rounded-full border border-amber-300">
                        に ひく いち は
                    </div>
                </div>
            </div>

            <!-- 選択肢 4択 -->
            <div class="w-full shrink-0 my-2">
                <div id="options-grid" class="flex justify-center items-center gap-2 sm:gap-4 w-full">
                    <!-- 動的に生成 -->
                </div>
            </div>

            <div class="text-center text-pink-600 font-bold text-[11px] shrink-0">
                せいかいの 丸いカードを選んでね！
            </div>
        </section>

        <!-- 3. クリア演出画面 -->
        <section id="clear-screen" class="hidden flex flex-col justify-center items-center h-full max-w-2xl mx-auto w-full py-2 relative z-40">
            <div id="clear-modal-box" class="bg-slate-900/95 border-2 border-amber-400/60 rounded-3xl p-4 sm:p-5 shadow-2xl w-full text-center space-y-3 relative overflow-y-auto max-h-full">
                <div class="space-y-1">
                    <div id="clear-badge" class="inline-block px-4 py-1 rounded-full text-xs font-black bg-amber-400 text-pink-900 shadow">
                        GOLD CLEAR!
                    </div>
                    <h2 id="clear-title" class="text-2xl font-black text-pink-300 drop-shadow">レベル1 クリア！</h2>
                    <p id="clear-subtitle" class="text-pink-200 text-xs sm:text-sm">おしゃれカードを ゲットしたよ！</p>
                    
                    <div id="world-clear-banner" class="hidden my-2 py-2 px-3 bg-gradient-to-r from-amber-400 via-rose-500 to-purple-600 text-white font-black text-sm rounded-xl shadow-lg border-2 border-white animate-bounce">
                        🎉 コンプリート達成！ 🎉
                    </div>
                </div>

                <!-- 獲得カードプレビュー（1〜5枚対応） -->
                <div class="flex justify-center py-1 overflow-x-auto">
                    <div id="reward-card-container" class="flex flex-wrap justify-center items-center gap-2.5">
                        <!-- カードDOM -->
                    </div>
                </div>

                <div class="space-y-2 pt-1 max-w-md mx-auto">
                    <button id="next-btn" onclick="handleNextStep()" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white text-lg font-black rounded-xl shadow-lg btn-3d border border-white/20 flex items-center justify-center gap-2">
                        <span>つぎへ すすむ</span>
                        <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                    <button onclick="startStage(currentStageNumber)" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-white font-black text-base rounded-xl shadow-md btn-3d border border-white/20 flex items-center justify-center gap-2">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                        <span>もう１かいする</span>
                    </button>
                    <button onclick="showStageSelect()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-xl shadow-md btn-3d border border-white/20 flex items-center justify-center gap-2 text-sm">
                        <i data-lucide="home" class="w-4 h-4"></i>
                        <span>メニューに戻る</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- 4. アルバム（カード図鑑）画面 -->
        <section id="album-screen" class="hidden flex flex-col h-full space-y-2 overflow-hidden">
            <div class="flex justify-between items-center border-b border-pink-400/40 pb-2 shrink-0">
                <div>
                    <h2 class="text-lg sm:text-xl font-black text-pink-600 flex items-center gap-1.5">
                        <i data-lucide="award" class="w-6 h-6 text-pink-500"></i> おしゃれカードずかん
                    </h2>
                    <p class="text-pink-500 font-bold text-xs">ゲットしたカードをタップして大きくみられるよ！</p>
                </div>
                <button onclick="showStageSelect()" class="bg-indigo-600 hover:bg-indigo-500 text-pink-100 font-bold px-3 py-1.5 rounded-xl text-xs btn-3d">
                    もどる
                </button>
            </div>

            <!-- カテゴリー別フィルターボタンバー (横スクロール対応・レア度非表示) -->
            <div id="album-filter-bar" class="flex gap-1.5 overflow-x-auto pb-1.5 shrink-0 scrollbar-none">
                <!-- JSで動的生成 -->
            </div>

            <!-- カードグリッド -->
            <div id="album-grid" class="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 p-1">
                <!-- 動的に生成 -->
            </div>
        </section>

        <!-- 5. カード拡大モーダル -->
        <div id="card-modal" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-4" onclick="closeCardModal()">
            <div class="relative transform scale-125 sm:scale-150 transition-transform duration-300" onclick="event.stopPropagation()">
                <div id="modal-card-container"></div>
            </div>
            <button onclick="closeCardModal()" class="mt-12 bg-white/20 hover:bg-white/30 text-white font-black px-6 py-2 rounded-full border border-white/40 text-sm shadow-xl backdrop-blur-md">

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;

        document.addEventListener('pointerdown', () => { getAudioContext(); }, { once: false });

        function playPinpon() {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;

            const osc1 = ctx.createOscillator();
            const gain1 = ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(1046.50, now);
            gain1.gain.setValueAtTime(0.3, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start(now);
            osc1.stop(now + 0.3);

            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1567.98, now + 0.15);
            gain2.gain.setValueAtTime(0.3, now + 0.15);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start(now + 0.15);
            osc2.stop(now + 0.5);
        }

        function playBuzzer() {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.setValueAtTime(120, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        function playFanfare(isAllClear = false) {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;

            const notes = isAllClear 
                ? [523.25, 659.25, 783.99, 1046.50, 880.00, 1046.50, 1174.66, 1318.51]
                : [523.25, 659.25, 783.99, 1046.50];

            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const startTime = now + idx * 0.12;
                const duration = idx === notes.length - 1 ? 0.8 : 0.15;

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, startTime);
                gain.gain.setValueAtTime(0.3, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(startTime);
                osc.stop(startTime + duration);
            });
        }

        function playCompleteFanfare() {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50, 1174.66, 1318.51, 1567.98, 1760.00, 2093.00];

            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const startTime = now + idx * 0.1;
                const duration = idx === notes.length - 1 ? 1.5 : 0.2;

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, startTime);
                gain.gain.setValueAtTime(0.35, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(startTime);
                osc.stop(startTime + duration);
            });
        }

        // バトル中の音楽：明るく楽しい・かわいいオルゴール＆ポップメロディ
        function startBGM() {
            stopBGM();
            const ctx = getAudioContext();
            if (!ctx) return;

            // かわいい長調（Cメジャー）の軽快な伴奏とキラキラメロディ
            const bassNotes = [261.63, 329.63, 392.00, 329.63, 349.23, 440.00, 392.00, 329.63, 293.66, 349.23, 392.00, 493.88, 523.25, 392.00, 329.63, 392.00];
            const leadNotes = [523.25, 659.25, 783.99, 659.25, 880.00, 1046.50, 880.00, 783.99, 698.46, 880.00, 783.99, 659.25, 587.33, 659.25, 523.25, 783.99];
            let noteIdx = 0;

            bgmInterval = setInterval(() => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                const now = audioCtx.currentTime;

                // やさしい三角波の伴奏
                const bassOsc = audioCtx.createOscillator();
                const bassGain = audioCtx.createGain();
                bassOsc.type = 'triangle';
                bassOsc.frequency.setValueAtTime(bassNotes[noteIdx % bassNotes.length], now);
                bassGain.gain.setValueAtTime(0.055, now);
                bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                bassOsc.connect(bassGain);
                bassGain.connect(audioCtx.destination);
                bassOsc.start(now);
                bassOsc.stop(now + 0.16);

                // かわいいサイン波のオルゴール風メロディ
                const leadOsc = audioCtx.createOscillator();
                const leadGain = audioCtx.createGain();
                leadOsc.type = 'sine';
                leadOsc.frequency.setValueAtTime(leadNotes[noteIdx % leadNotes.length], now);
                leadGain.gain.setValueAtTime(0.065, now);
                leadGain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
                leadOsc.connect(leadGain);
                leadGain.connect(audioCtx.destination);
                leadOsc.start(now);
                leadOsc.stop(now + 0.17);

                noteIdx++;
            }, 185);
        }

        function stopBGM() {

        // レベル別引き算問題生成プール取得
        function getPoolForLevel(level) {
            const pool = [];
            if (level === 1) {
                // ①レベル1：各項が5以下の引き算（答えが0になる問題1問、いずれかの項が0になる問題1問、それ以外8問）
                const zeroAnsPool = [];
                const zeroTermPool = [];
                const normalPool = [];
                for (let a = 1; a <= 5; a++) {
                    zeroAnsPool.push({ num1: a, num2: a, answer: 0 });
                    zeroTermPool.push({ num1: a, num2: 0, answer: a });
                    for (let b = 1; b < a; b++) {
                        normalPool.push({ num1: a, num2: b, answer: a - b });
                    }
                }
                zeroAnsPool.sort(() => Math.random() - 0.5);
                zeroTermPool.sort(() => Math.random() - 0.5);
                normalPool.sort(() => Math.random() - 0.5);
                pool.push(zeroAnsPool[0], zeroTermPool[0], ...normalPool.slice(0, 8));
            } else if (level === 2) {
                // ②レベル2：引かれる数が6〜10の引き算（各項に0が入る問題は出さない）
                for (let a = 6; a <= 10; a++) {
                    for (let b = 1; b < a; b++) {
                        pool.push({ num1: a, num2: b, answer: a - b });
                    }
                }
            } else if (level === 3) {
                // ③レベル3：「10いくつ－1桁＝10いくつ」（引く数が0の問題は出さない、答えが10になる問題を出してもよい）
                for (let a = 11; a <= 19; a++) {
                    for (let b = 1; b <= 9; b++) {
                        if (a - b >= 10) {
                            pool.push({ num1: a, num2: b, answer: a - b });
                        }
                    }
                }
            } else if (level === 4) {
                // ④レベル4：繰り下がる引き算（例えば13－7＝6、各項に0が入る問題は出さない）
                for (let a = 11; a <= 18; a++) {
                    for (let b = 2; b <= 9; b++) {
                        if (a - b < 10 && a - b >= 1) {
                            pool.push({ num1: a, num2: b, answer: a - b });
                        }
                    }
                }
            }
            return pool;
        }

        function generateQuestions(level) {
            if (level === 5) {
                // ⑤レベル5：レベル3の問題種の中から3問、レベル4の問題種の中から7問をランダムに出題
                const p3 = getPoolForLevel(3).sort(() => Math.random() - 0.5).slice(0, 3);
                const p4 = getPoolForLevel(4).sort(() => Math.random() - 0.5).slice(0, 7);
                const combined = [...p3, ...p4];
                combined.sort(() => Math.random() - 0.5);
                return combined;
            }

            const pool = getPoolForLevel(level);
            pool.sort(() => Math.random() - 0.5);
            return pool.slice(0, 10);
        }

            shuffled.forEach(ans => {
                const btn = document.createElement('button');
                btn.className = "w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gradient-to-tr from-indigo-600 via-blue-500 to-cyan-400 border-4 border-white text-white text-xl sm:text-2xl font-black shadow-xl btn-3d flex items-center justify-center hover:scale-105 transition-transform";
                btn.innerText = ans;
                btn.onclick = (e) => checkAnswer(ans, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function generateSmartOptions(q) {
            const answer = q.answer;
            const candidates = new Set();

            [answer - 1, answer + 1, answer - 2, answer + 2, answer - 3, answer + 3, answer + 10, answer - 10].forEach(val => {
                if (val >= 0 && val <= 25 && val !== answer) {
                    candidates.add(val);
                }
            });

            for (let v = 0; v <= 20; v++) {
                if (v !== answer) candidates.add(v);
            }

            const sortedCandidates = Array.from(candidates).sort((a, b) => Math.abs(a - answer) - Math.abs(b - answer));
            const topPool = sortedCandidates.slice(0, Math.min(6, sortedCandidates.length));
            topPool.sort(() => Math.random() - 0.5);

            const wrongOptions = topPool.slice(0, 3);
            const result = [answer, ...wrongOptions];

            return result.sort(() => Math.random() - 0.5);
        }

        function checkAnswer(selectedAns, btn) {
            if (isProcessingAnswer) return;
            const q = gameState.questions[gameState.currentQuestionIndex];
            if (!q) return;

            if (selectedAns === q.answer) {
                isProcessingAnswer = true;
                playPinpon();
                speakSubAnswer(q.answer);

                btn.classList.remove('from-indigo-600', 'via-blue-500', 'to-cyan-400');
                btn.classList.add('from-emerald-400', 'to-teal-500', 'scale-110');

                const isFinalQuestion = (gameState.currentQuestionIndex + 1 >= gameState.questions.length);

                if (!isFinalQuestion) {
                    // 途中問題：ハート弾丸攻撃
                    const missile = document.getElementById('missile-anim');
                    if (missile) {
                        missile.classList.remove('hidden');
                        missile.classList.add('animate-fly-missile');
                        setTimeout(() => {
                            missile.classList.add('hidden');
                            missile.classList.remove('animate-fly-missile');
                            
                            const hit = document.getElementById('hit-explosion');
                            if (hit) {
                                hit.classList.remove('hidden');
                                setTimeout(() => hit.classList.add('hidden'), 350);
                            }
                        }, 400);
                    }

                    setTimeout(() => {
                        gameState.currentQuestionIndex++;
                        updateMasterGaugeUI();
                        renderMonsterSvg();
                        showQuestion();
                    }, 1200);
                } else {
                    // 最終問題：フラッシュGET演出
                    gameState.currentQuestionIndex++;
                    updateMasterGaugeUI();

                    const targetBox = document.getElementById('target-pokemon-scale-box');
                    const stars = document.getElementById('capture-stars');
                    const hit = document.getElementById('hit-explosion');

                    setTimeout(() => {
                        if (hit) {
                            hit.innerHTML = '<div class="text-5xl animate-ping">✨</div>';
                            hit.classList.remove('hidden');
                        }

                        if (stars) {
                            stars.innerText = '✨ FLASH! ✨';
                            stars.classList.remove('hidden');
                        }

                        setTimeout(() => {
                            if (targetBox) {
                                targetBox.classList.add('opacity-0', 'scale-0', 'transition-all', 'duration-500');
                            }
                        }, 300);

                        setTimeout(() => {
                            if (hit) hit.classList.add('hidden');
                            handleStageClear();
                        }, 1600);

                    }, 300);
                }

            } else {
                playBuzzer();
                btn.classList.add('animate-shake', 'from-rose-600', 'to-red-700');
                setTimeout(() => btn.classList.remove('animate-shake'), 400);

                gameState.lives--;
                updateHeartsUI();

                if (gameState.lives <= 0) {
                    stopBGM();
                    document.getElementById('gameover-modal').classList.remove('hidden');
                }
            }
        }

        function handleStageClear() {
            stopBGM();

            const level = gameState.currentLevel;

            let rank = 'bronze';
            if (gameState.lives === 3) rank = 'gold';
            else if (gameState.lives === 2) rank = 'silver';

            const currentRank = gameState.clearedRanks[level];
            const rankWeight = { gold: 3, silver: 2, bronze: 1 };
            if (!currentRank || rankWeight[rank] > (rankWeight[currentRank] || 0)) {
                gameState.clearedRanks[level] = rank;
            }

            // 次のレベル開放（レベル1クリア→2開放、2→3、3→4、4→5）
            if (level < 5 && !gameState.unlockedLevels.includes(level + 1)) {
                gameState.unlockedLevels.push(level + 1);
            }

            const prevOwnedCount = gameState.ownedCards.length;
            const prev20Done = isFirst20Complete();
            const prev40Done = isFirst40Complete();

            // レベルごとの枚数だけ未所持カードを被らずに取得（すべてNEWのカードが引ける）
            const levelInfo = LEVELS_INFO.find(l => l.level === level) || LEVELS_INFO[0];
            const rewardCount = levelInfo.rewardCount;
            const drawnCards = [];

            for (let i = 0; i < rewardCount; i++) {
                const card = drawUnownedOshareCard();
                if (card) {
                    drawnCards.push(card);
                    if (!gameState.ownedCards.includes(card.id)) {
                        gameState.ownedCards.push(card.id);
                    }
                    if (!gameState.newCards.includes(card.id)) {
                        gameState.newCards.push(card.id);
                    }
                }
            }

            saveData();

            const currentOwnedCount = gameState.ownedCards.length;
            const current20Done = isFirst20Complete();
            const current40Done = isFirst40Complete();

            const clearBadge = document.getElementById('clear-badge');
            if (rank === 'gold') {
                clearBadge.innerText = '🥇 PERFECT GOLD!';
                clearBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-black bg-amber-400 text-slate-900 shadow gold-glow';
            } else if (rank === 'silver') {
                clearBadge.innerText = '🥈 SILVER CLEAR';
                clearBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-black bg-slate-300 text-slate-900 shadow';
            } else {
                clearBadge.innerText = '🥉 BRONZE CLEAR';
                clearBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-black bg-amber-700 text-white shadow';
            }

            document.getElementById('clear-title').innerText = `レベル${level} クリア！`;
            document.getElementById('clear-subtitle').innerText = `おしゃれカードを ${rewardCount}まい ゲットしたよ！`;

            const banner = document.getElementById('world-clear-banner');

            const reached20 = !prev20Done && current20Done;
            const reached40 = !prev40Done && current40Done;
            const reached60 = (prevOwnedCount < 60) && (currentOwnedCount === 60);
            const isAlwaysCelebrate = (currentOwnedCount === 60);

            if (reached60) {
                banner.innerText = '👑 おしゃれずかん 60種コンプリート達成！！ 👑';
                banner.classList.remove('hidden');
                launchCelebration(true, true);
                playCompleteFanfare();
            } else if (reached40) {
                banner.innerText = '✨ 40種コンプリート！60種すべて解禁！！ ✨';
                banner.classList.remove('hidden');
                launchCelebration(false, true);
                playFanfare(true);
            } else if (reached20) {
                banner.innerText = '✨ 20種コンプリート！40種まで解禁！！ ✨';
                banner.classList.remove('hidden');
                launchCelebration(false, true);
                playFanfare(true);
            } else if (isAlwaysCelebrate) {
                banner.innerText = '👑 おしゃれずかんコンプリート中！ 👑';
                banner.classList.remove('hidden');
                launchCelebration(false, false);
                playFanfare(false);
            } else {
                banner.classList.add('hidden');
                playFanfare(false);
            }

            const cardBox = document.getElementById('reward-card-container');
            if (cardBox && drawnCards.length > 0) {
                const isCompact = drawnCards.length >= 2;
                cardBox.innerHTML = drawnCards.map(c => {
                    const cardHtml = createCardHtml(c, false, isCompact);
                    return `<div onclick="showCardModalById('${c.id}')" class="transform hover:scale-105 transition-transform duration-200 cursor-pointer">${cardHtml}</div>`;
                }).join('');
            }

            hideAllScreens();
            document.getElementById('clear-screen').classList.remove('hidden');
        }

        // --- カード抽選ロジック：すべて被らず、NEWのカードが引ける ---
        function drawUnownedOshareCard() {
            const globalLimit = getGlobalCardLimit(); // 20, 40, or 60
            // 現在の開放枠（20 -> 40 -> 60）の中でまだ持っていないカードを探す
            let unownedPool = POKEMON_CARDS.slice(0, globalLimit).filter(c => !gameState.ownedCards.includes(c.id));

            // 現在の枠の未所持が0なら、全60種から未所持を探す
            if (unownedPool.length === 0) {
                unownedPool = POKEMON_CARDS.filter(c => !gameState.ownedCards.includes(c.id));
            }

            // 60種すべてコンプリート済みの場合は全60種からランダムに1枚選ぶ
            if (unownedPool.length === 0) {
                return POKEMON_CARDS[Math.floor(Math.random() * POKEMON_CARDS.length)];
            }

            const idx = Math.floor(Math.random() * unownedPool.length);
            return unownedPool[idx];
        }

        function showCardModalById(cardId) {
            const card = POKEMON_CARDS.find(c => c.id === cardId);
            if (card) showCardModal(card);
        }

        function handleNextStep() {
            if (gameState.currentLevel < 5) {
                startStage(gameState.currentLevel + 1);
            } else {
                showStageSelect();
            }
        }

        function retryCurrentStage() {
            startStage(gameState.currentLevel);

        // 一番上に「物の名前」、その下に「イラスト」、その下に「特徴や値段などの説明」、レア度は非表示
        function createCardHtml(card, isModal = false, isCompact = false) {
            const isNew = gameState.newCards.includes(card.id);

            const borderStyle = card.foil ? 'border-pink-300 super-glow' : 'border-amber-400/80';

            const nameClass = isModal 
                ? 'text-sm sm:text-base tracking-wide text-pink-200 drop-shadow-md leading-tight font-black text-center w-full' 
                : (isCompact ? 'text-xs tracking-wide truncate w-full text-center drop-shadow-md text-pink-200 font-black' : 'text-sm sm:text-base tracking-wide truncate w-full text-center drop-shadow-md text-pink-200 font-black');

            const illusBgClass = 'bg-stone-950/70 border-white/20 shadow-inner';
            const illusHeightClass = isCompact ? 'h-20 sm:h-24' : 'h-28 sm:h-32';
            const descTextClass = isCompact ? 'text-[9px] leading-tight line-clamp-2' : 'text-[10px] sm:text-xs leading-snug';
            const priceTextClass = isCompact ? 'text-[10px]' : 'text-xs';

            return `
                <div class="relative ${scaleClass} rounded-2xl p-2 bg-gradient-to-b ${card.bgTone} border-4 ${borderStyle} shadow-2xl flex flex-col justify-between ${extraEffectClass} text-pink-100 overflow-hidden select-none">
                    
                    ${isNew ? `
                        <div class="absolute top-1 right-1 z-50 bg-gradient-to-r from-red-600 to-rose-500 text-white font-black text-[10px] px-2 py-0.5 rounded-full border-2 border-white shadow-xl animate-bounce">
                            NEW!
                        </div>
                    ` : ''}

                    <!-- 一番上：物の名前 -->
                    <div class="flex justify-center items-center z-10 border-b border-white/20 pb-1">
                        <span class="${nameClass}">${card.name}</span>
                    </div>

                    <!-- その下：イラスト -->
                    <div class="my-1 ${illusHeightClass} rounded-xl ${illusBgClass} border flex items-center justify-center relative overflow-hidden shadow-inner">
                        ${getPokemonSvgIllustration(card, isCompact)}

                    <div class="bg-stone-950/85 rounded-xl p-1.5 border border-white/15 z-10 flex flex-col justify-between gap-1">

                            <span class="${priceTextClass} font-black text-pink-300">💰 ${card.price}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- アルバム（カードずかん）機能 ---

        function renderAlbumFilters() {
            const filterBar = document.getElementById('album-filter-bar');
            if (!filterBar) return;

            const limit = getGlobalCardLimit(); // 20, 40, or 60
            const availableCards = POKEMON_CARDS.slice(0, limit);

            const filters = ['すべて', ...CATEGORY_LIST];

            if (!filters.includes(currentAlbumFilter)) {
                currentAlbumFilter = 'すべて';
            }

            filterBar.innerHTML = '';

            filters.forEach(cat => {
                const btn = document.createElement('button');
                
                let count = 0;
                let totalInCat = 0;

                if (cat === 'すべて') {
                    count = availableCards.filter(c => gameState.ownedCards.includes(c.id)).length;
                    totalInCat = limit;
                } else {
                    count = availableCards.filter(c => c.category === cat && gameState.ownedCards.includes(c.id)).length;
                    totalInCat = availableCards.filter(c => c.category === cat).length;
                }

                const isActive = currentAlbumFilter === cat;

                btn.className = `px-3 py-1 rounded-full text-xs font-black whitespace-nowrap transition-all ${
                    isActive 
                        ? 'bg-amber-400 text-slate-900 border-2 border-white shadow' 
                        : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-indigo-500/30'
                }`;
                btn.innerText = `${cat} (${count}/${totalInCat})`;
                btn.onclick = () => {
                    currentAlbumFilter = cat;
                    renderAlbumFilters();
                    renderAlbumGrid();
                };
                filterBar.appendChild(btn);
            });
        }

        function showAlbum() {
            stopBGM();
            hideAllScreens();
            document.getElementById('album-screen').classList.remove('hidden');
            renderAlbumFilters();
            renderAlbumGrid();
        }

        function renderAlbumGrid() {
            const grid = document.getElementById('album-grid');
            if (!grid) return;
            grid.innerHTML = '';

            const limit = getGlobalCardLimit();
            const availableCards = POKEMON_CARDS.slice(0, limit);

            let filteredCards = availableCards;
            if (currentAlbumFilter !== 'すべて') {
                filteredCards = availableCards.filter(c => c.category === currentAlbumFilter);
            }

            filteredCards.forEach(card => {
                const isOwned = gameState.ownedCards.includes(card.id);
                const wrapper = document.createElement('div');
                wrapper.className = "flex justify-center items-center cursor-pointer transform hover:scale-105 transition-transform duration-200";

                if (isOwned) {
                    wrapper.innerHTML = createCardHtml(card);
                    wrapper.onclick = () => showCardModal(card);
                } else {
                    wrapper.innerHTML = `
                        <div class="w-48 h-72 rounded-2xl bg-slate-900/80 border-2 border-slate-700 flex flex-col items-center justify-center text-slate-600 p-2 text-center shadow-inner relative overflow-hidden">
                            <i data-lucide="lock" class="w-8 h-8 mb-2 text-slate-600"></i>
                            <span class="text-xs font-bold text-slate-500">???</span>
                            <span class="text-[10px] text-slate-600 mt-1 font-bold">${card.category}</span>
                        </div>
                    `;
                }
                grid.appendChild(wrapper);
            });

            if (window.lucide) lucide.createIcons();
        }

        function showCardModal(card) {
            const container = document.getElementById('modal-card-container');
            if (!container) return;
            container.innerHTML = createCardHtml(card, true);

            // 既読処理
            const newIndex = gameState.newCards.indexOf(card.id);
            if (newIndex !== -1) {
                gameState.newCards.splice(newIndex, 1);
                saveData();
                if (!document.getElementById('album-screen').classList.contains('hidden')) {
                    renderAlbumGrid();
                }
            }

            document.getElementById('card-modal').classList.remove('hidden');
        }

        function closeCardModal() {
            document.getElementById('card-modal').classList.add('hidden');
        }

        // --- お祝い演出（紙吹雪 & 連発花火） ---
        let celebrationAnimId = null;

        function launchCelebration(isComplete = false, isAllClear = false) {
            const canvas = document.getElementById('celebration-canvas');
            if (!canvas) return;
            canvas.classList.remove('hidden');
            const ctx = canvas.getContext('2d');
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const fireworks = [];

            const particleCount = isComplete ? 200 : (isAllClear ? 150 : 80);
            const colors = ['#f43f5e', '#ec4899', '#d946ef', '#a855f7', '#6366f1', '#3b82f6', '#06b6d4', '#10b981', '#84cc16', '#eab308', '#f97316'];

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: Math.random() * 2 - 1,
                    vy: Math.random() * 3 + 2,
                    rot: Math.random() * 360,
                    vRot: Math.random() * 10 - 5
                });
            }

            function createFirework() {
                const fx = Math.random() * (canvas.width * 0.8) + canvas.width * 0.1;
                const fy = Math.random() * (canvas.height * 0.5) + canvas.height * 0.1;
                const count = Math.floor(Math.random() * 30) + 40;
                const fwColor = colors[Math.floor(Math.random() * colors.length)];

                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.2;
                    const speed = Math.random() * 5 + 3;
                    fireworks.push({
                        x: fx,
                        y: fy,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: Math.random() * 3 + 2,
                        color: fwColor,
                        alpha: 1,
                        decay: Math.random() * 0.02 + 0.015
                    });
                }
            }

            let fwTimer = 0;
            const fwFrequency = isComplete ? 12 : 25;

            if (celebrationAnimId) cancelAnimationFrame(celebrationAnimId);

            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                fwTimer++;
                if (fwTimer % fwFrequency === 0) {
                    createFirework();
                }

                for (let i = fireworks.length - 1; i >= 0; i--) {
                    const fw = fireworks[i];
                    fw.x += fw.vx;
                    fw.y += fw.vy;
                    fw.vy += 0.05;
                    fw.alpha -= fw.decay;

                    if (fw.alpha <= 0) {
                        fireworks.splice(i, 1);
                        continue;
                    }

                    ctx.save();
                    ctx.globalAlpha = fw.alpha;
                    ctx.fillStyle = fw.color;
                    ctx.beginPath();
                    ctx.arc(fw.x, fw.y, fw.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rot += p.vRot;

                    if (p.y > canvas.height) {
                        p.y = -10;
                        p.x = Math.random() * canvas.width;
                    }

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                celebrationAnimId = requestAnimationFrame(loop);
            }

            loop();

            setTimeout(() => {
                if (celebrationAnimId) cancelAnimationFrame(celebrationAnimId);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas.classList.add('hidden');
            }, isComplete ? 8000 : 5000);
        }

        // ウィンドウロード時初期化
        window.onload = function() {
            loadSaveData();
            showStageSelect();
        };
    </script>
</body>
